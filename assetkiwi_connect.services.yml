services:
  logger.channel.assetkiwi_connect:
    parent: logger.channel_base
    arguments: ['assetkiwi_connect']
  assetkiwi_connect.client:
    class: Drupal\assetkiwi_connect\Client\AssetKiwiClient
    arguments:
      - '@config.factory'
      - '@http_client'
      - '@logger.factory'
      - '@file_system'
      - '@request_stack'
      - '@logger.channel.assetkiwi_connect'
  assetkiwi_connect.mime_icon_resolver:
    class: Drupal\assetkiwi_connect\Utility\MimeIconResolver
  assetkiwi_connect.existing_media_resolver:
    class: Drupal\assetkiwi_connect\ExistingMediaResolver
    arguments:
      - '@entity_type.manager'
